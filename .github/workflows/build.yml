# Automatically build the project and run any configured tests for every pushed
# release tag, and publish the jar as a GitHub release.

name: build
run-name: ${{ github.ref_name }}
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: resolve version
        id: meta
        run: echo "version=$(sed -n 's/^mod_version=//p' gradle.properties)" >> "$GITHUB_OUTPUT"
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      # Also validates the Gradle wrapper checksum.
      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6
      - name: build
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: metallum
          path: build/libs/metallum-${{ steps.meta.outputs.version }}.jar
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: download build artifacts
        uses: actions/download-artifact@v5
        with:
          name: metallum
          path: release-artifacts

      - name: create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-artifacts/metallum-${{ needs.build.outputs.version }}.jar
